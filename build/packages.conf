# shellcheck shell=bash
# =============================================================================
# packages.conf — definitive package selection for omarchy:4.0.1 (linux/amd64)
# =============================================================================
#
# Sourced by build/build-image.sh. Pure data + comments; no side effects, no
# commands, no `set` calls. Safe under `set -euo pipefail`.
#
# PROVENANCE
#   Derived from PROBE 2, which resolved and then REALLY INSTALLED this exact
#   selection out of the ISO's bundled [offline] mirror into a rootfs with
#   pacman exit code 0, all 29 post-transaction hooks clean. Sizes below are
#   measured on that tree, not estimated. Do not "improve" these lists without
#   re-measuring — several entries look droppable and are not (see NOTES).
#
#   Upstream sources, both inside airootfs.sfs at /usr/share/omarchy-iso/:
#     omarchy-base.packages    151 entries — the desktop           -> used
#     omarchy-other.packages    76 entries — hardware/kernel/driver -> REJECTED
#                                            WHOLESALE (see EXCLUDE §0)
#
# THE TWO-PHASE RULE (mandatory, not stylistic)
#   BASE and DESKTOP must be two separate pacman transactions, in that order.
#   In a single transaction, dconf's and fontconfig's .INSTALL scriptlets run
#   before /usr/bin/vercmp (shipped by `pacman`) has landed, and you get two
#   `vercmp: command not found` warnings. Splitting fixes it and also matches
#   the ISO installer's own lua51/luarocks-before-omarchy-nvim ordering.
#
# FLAGS EVERY PHASE MUST CARRY
#   --disable-sandbox                      (alpm sandbox is broken here — the
#                                           amd64 container gives "error
#                                           restricting syscalls via seccomp:
#                                           22!", a chroot gives "Landlock is
#                                           not supported by the kernel")
#   ${OMARCHY_ASSUME_INSTALLED[@]}         (expanded via omarchy_assume_flags)
#
# =============================================================================


# -----------------------------------------------------------------------------
# Repositories
# -----------------------------------------------------------------------------
# [offline] — the ISO's bundled mirror, loop-mounted in place, NEVER copied and
# NEVER extracted to the host. 1249 packages; verified to contain the entire
# desktop closure with zero unresolvable dependencies.
OMARCHY_OFFLINE_REPO_PATH="/mnt/root/var/cache/omarchy/mirror/offline"
OMARCHY_OFFLINE_REPO_SERVER="file://${OMARCHY_OFFLINE_REPO_PATH}/"

# Arch Linux Archive snapshot, used only for the VNC + fallback-compositor
# layer ([offline] does not carry those at all). It MUST match the ISO's own
# build date or you get version skew against the offline mirror.
#
# LEAVE THESE EMPTY. build-image.sh reads the ISO's arch/version once it is
# mounted (e.g. 2026.08.25) and derives the snapshot from it, which is correct
# for every release. Setting them here pins the value and DISABLES that
# derivation -- silently building a newer ISO against an old snapshot.
#
# Override only to work around a bad day in the archive, and prefer the flag:
#     ./build/build-image.sh --ala-date 2026/08/25
OMARCHY_ALA_SNAPSHOT=""
OMARCHY_ALA_SERVER=""


# =============================================================================
# OMARCHY_PKGS_BASE — pacman phase 1
# =============================================================================
# Minimal Arch base that makes sense in a container, plus the four Omarchy
# packages that MUST precede phase 2 for ordering reasons.
#
# Note what is NOT here: no `linux`, no `linux-firmware`, no `linux-headers`, no
# `mkinitcpio`. archinstall's minimal_installation() pacstraps a kernel; that is
# the entire 18-package gap between the ISO's `expected-packages` (943) and our
# resolved closure (925 full / 867 container). A container must never have one.
#
OMARCHY_PKGS_BASE=(
  base              # glibc, coreutils, bash, systemd, pacman. The floor.
  base-devel        # REQUIRED, not optional: `yay` cannot build a single AUR
                    #   package without it, and Omarchy ships yay as the
                    #   user-facing installer. Also supplies fakeroot/make/gcc.
  git               # omarchy metapackage dep; omarchy-update pulls via git.

  omarchy-keyring   # must land before any other omarchy-* package.
  omarchy-settings  # =4.0.1; ships /etc/skel, hypr configs, themes, sddm.conf.d
                    #   (the sddm dir is inert for us — see EXCLUDE sddm).

  lua51             # phase-1 on purpose: the ISO installer's own
  luarocks          #   EARLY_LUAROCKS_PACKAGES ordering. The luarocks manifest
  omarchy-nvim      #   hook then runs clean at hook 27/29 in phase 2.
)


# =============================================================================
# OMARCHY_PKGS_DESKTOP — pacman phase 2
# =============================================================================
# The `omarchy` metapackage plus omarchy-base.packages minus OMARCHY_PKGS_EXCLUDE.
# 114 explicit names. Resolves to 867 packages total across both phases.
#
# The `omarchy` metapackage's own %DEPENDS% are:
#   omarchy-keyring omarchy-settings=4.0.1 limine limine-mkinitcpio-hook
#   limine-snapper-sync snapper hyprland quickshell uwsm sddm
#   xdg-desktop-portal-hyprland wireplumber pipewire gnome-keyring gum jq git
#   perl fakeroot pacman-contrib ttf-jetbrains-mono-nerd-basic
# Six of those are bootloader/snapshot/display-manager junk; see
# OMARCHY_ASSUME_INSTALLED. Everything else is wanted and comes in transitively
# (pipewire and perl are never listed explicitly for that reason).
#
OMARCHY_PKGS_DESKTOP=(
  # --- the metapackage -------------------------------------------------------
  omarchy                             # pulls hyprland, quickshell, uwsm,
                                      #   xdg-desktop-portal-hyprland, pipewire,
                                      #   gnome-keyring, gum, perl, ...

  # --- compositor / session --------------------------------------------------
  hyprland                            # 0.56.2-1. Binary is /usr/bin/Hyprland,
                                      #   CAPITAL H. There is no lowercase
                                      #   `hyprland` executable — scripts that
                                      #   call it lowercase will fail.
  quickshell                          # 0.3.1-1; Omarchy's bar/menus/OSD.
  uwsm                                # 0.26.7-1; the supported way to start the
                                      #   session now that sddm is gone:
                                      #   the compositor DIRECTLY as user omarchy (uwsm needs a systemd user
#   session, which this image has none of). See omarchy-container-init.
  wireplumber                         # pipewire session manager.
  xdg-desktop-portal-hyprland         # screenshare/filepicker portal backend.
  xdg-desktop-portal-gtk              # GTK filechooser portal.
  xdg-terminal-exec                   # xdg-terminal-exec spec handler.
  hyprpicker                          # colour picker.
  hyprsunset                          # night-light / gamma.
  hyprland-guiutils                   # hyprland's GUI dialogs.
  hyprland-preview-share-picker       # screencast source picker.
  gnome-keyring                       # secret service; libsecret's backend.
  libsecret                           # secret service client lib.

  # --- terminal, shell, CLI --------------------------------------------------
  foot                                # 1.27.0-2. THE terminal. Never drop.
  tmux
  starship                            # prompt.
  bash-completion
  fzf
  ripgrep
  fd
  bat
  eza
  zoxide
  less
  jq
  expac
  dua-cli
  btop
  fastfetch
  inxi
  tldr
  man-db                              # kept even though /usr/share/man is
                                      #   stripped — `man` must exist for pages
                                      #   installed later by yay/AUR.
  plocate
  inotify-tools
  unzip
  socat
  whois
  inetutils                           # hostname, telnet, ftp.
  pacman-contrib                      # paccache/checkupdates; omarchy dep.
  gum                                 # omarchy's TUI prompts; omarchy dep.

  # --- editor / dev ----------------------------------------------------------
  nvim                                # Omarchy's neovim package (paired with
                                      #   omarchy-nvim from phase 1). Verified
                                      #   resolvable from [offline].
  lazygit
  clang                               # }- 440 MiB together; see SLIM tier.
  llvm                                # }  Kept by default: LSPs and
                                      #    tree-sitter builds want them.
  tree-sitter-cli
  ruby
  mise-bin                            # runtime version manager.
  usage                               # mise's CLI spec tool.
  python-gobject                      # also guarantees `python` exists, which
                                      #   the vendored websockify needs.
  python-poetry-core
  libyaml
  mariadb-libs                        # client libs only, no server. ~10 MiB.
  postgresql-libs                     # client libs only, no server.
  fakeroot                            # omarchy dep; also needed by yay.
  yay                                 # AUR helper. Needs base-devel +
                                      #   DisableSandbox in /etc/pacman.conf.

  # --- browser / apps a user WILL notice missing -----------------------------
  chromium                            # 151.0.7922.173. 416 MiB. The browser.
                                      #   Slow under llvmpipe+Rosetta but
                                      #   present and working. Never in SLIM.
  nautilus                            # THE file manager.
  nautilus-python                     # nautilus extensions.
  sushi                               # nautilus space-bar previewer.
  gvfs-mtp                            # }- nautilus backends. mtp needs USB and
  gvfs-nfs                            # }  nfs/smb need /dev/fuse + network
  gvfs-smb                            # }  mounts; all three are a few MiB and
                                      #    nautilus's UI degrades without them.
  evince                              # PDF viewer.
  imv                                 # image viewer.
  mpv                                 # video player.
  mpv-mpris
  pinta                               # image editor.
  xournalpp                           # PDF annotation.
  imagemagick
  libvips
  ffmpegthumbnailer
  qt6-imageformats
  zbar                                # QR decode.
  qrencode                            # QR encode.
  tesseract                           # OCR (omarchy's screenshot-to-text).
  tesseract-data-eng
  yt-dlp
  libreoffice-fresh                   # 546 MiB. SLIM tier candidate.
  obsidian                            # 358 MiB. SLIM tier candidate.
  kdenlive                            # 755 MiB. SLIM tier candidate.
  obs-studio                          # 43 MiB. SLIM tier candidate.
  localsend                           # 68 MiB. SLIM tier candidate.
  moonlight-qt                        # 2 MiB. SLIM tier candidate.
  dotnet-runtime                      # 94 MiB. SLIM tier candidate.

  # --- Omarchy's own first-party apps ----------------------------------------
  aether
  cliamp
  herdr
  omacalc
  omacut
  omawrite
  tensaku
  tobi-try
  ttfx

  # --- screenshot / clipboard / input ----------------------------------------
  grim                                # wayland screenshot.
  slurp                               # region select.
  wl-clipboard                        # wl-copy/wl-paste.
  wtype                               # synthetic keystrokes.
  gpu-screen-recorder                 # will not capture without a DRM node, but
                                      #   its ffmpeg dep is required anyway and
                                      #   omarchy keybinds call it — dropping it
                                      #   breaks the keybinding, not the desktop.

  # --- audio (no device, but the scripts need the binaries) ------------------
  alsa-utils                          # }- a few MiB. Omarchy's volume keybinds
  pamixer                             # }  shell out to these. Removing them
                                      #    breaks omarchy scripts, not audio
                                      #    (which is already absent).

  # --- fonts / theming (never strip: directly user-visible) ------------------
  fontconfig
  noto-fonts
  noto-fonts-cjk                      # 298 MiB. Deliberately NOT in SLIM —
                                      #   without it CJK renders as tofu.
  noto-fonts-emoji
  ttf-jetbrains-mono-nerd-basic       # omarchy dep; the default UI font.
  ttf-ia-writer
  woff2-font-awesome
  yaru-icon-theme
  gnome-themes-extra

  # --- input methods ---------------------------------------------------------
  fcitx5
  fcitx5-gtk
  fcitx5-qt

  # --- networking ------------------------------------------------------------
  networkmanager                      # KEPT ON PURPOSE, WITH A CAVEAT: quickshell
                                      #   and omarchy's menus shell out to nmcli
                                      #   and look broken without it. But
                                      #   NetworkManager.service MUST NEVER be
                                      #   enabled/started in the container — it
                                      #   would try to manage Docker's veth and
                                      #   can sever networking. Install-only.
)


# =============================================================================
# OMARCHY_PKGS_VNC — from the pinned ALA snapshot, NOT from [offline]
# =============================================================================
# RESEARCH §6 reconfirmed by PROBE 2 against the real built rootfs:
# /usr/bin/wayvnc does not exist in the offline mirror. wayvnc, neatvnc, aml and
# vulkan-swrast are all absent from [offline] and must come from the archive.
#
# Everything these link against — pixman, libdrm, mesa/gbm, wayland,
# libxkbcommon, gnutls, nettle, libjpeg-turbo, zlib, libdisplay-info — is
# already in the phase-1/phase-2 closure, so this layer adds ~60 MiB, almost all
# of it vulkan-swrast.
#
OMARCHY_PKGS_VNC=(
  wayvnc            # 0.10.1-1. Proven working end-to-end in PROBE 1 against a
                    #   headless wlroots output: real 1280x800 framebuffer, 346
                    #   distinct colours over RFB. The VNC half is not the risk.
  neatvnc           # 1.0.1-2. wayvnc's RFB implementation.
  aml               # 1.0.0-1. SEE OMARCHY_PKGS_VNC_URL — this one is poisoned.
  vulkan-swrast     # 1:26.2.1-1 (lavapipe). Exactly matches [offline]'s mesa
                    #   1:26.2.1-1, zero skew. ~50 MiB. Needed by anything that
                    #   asks for Vulkan (Qt6/quickshell can); without it those
                    #   apps hard-fail instead of falling back to llvmpipe.
)

# ARCH LINUX ARCHIVE POISON PILL — do not skip this.
# aml-1.0.0-1-x86_64.pkg.tar.zst in the 2026/08/25 snapshot does NOT match the
# SHA256 recorded in that snapshot's extra.db (db says d3a87fac8acf0b55…, the
# served file is 7665bb28a2ce0a11…, stable across refetches — the pool file was
# rebuilt in place). pacman aborts the ENTIRE transaction with "invalid or
# corrupted package". Since aml is a wayvnc dependency, `pacman -S wayvnc` WILL
# hit it.
# Workaround, verified: curl these URLs and `pacman -U --noconfirm` them BEFORE
# the `pacman -S "${OMARCHY_PKGS_VNC[@]}"` call. `pacman -U` does not consult
# the db checksum. wayvnc, neatvnc and vulkan-swrast are all checksum-clean.
# -----------------------------------------------------------------------------
# OMARCHY_PKGS_FALLBACK — wlroots compositor, also from the pinned ALA snapshot
# -----------------------------------------------------------------------------
# WHY THIS EXISTS (measured 2026-08-30, see docs/RESEARCH.md section 12):
#
# Hyprland 0.56.2 / aquamarine 0.14.0 cannot render without an EGL device that
# reports a DRM device file. aquamarine's DRM backend only ever calls
# CDRMRenderer::attempt(backend, drmFD) (DRM.cpp:669 and :1237), which requires
# EGL_EXT_platform_device and matches EGL devices on EGL_DRM_DEVICE_FILE_EXT.
# On a vkms-only host mesa enumerates exactly one EGL device:
#     device[0]: DRM_DEVICE_FILE=(none)  RENDER_NODE=(none)
#                exts: EGL_MESA_device_software
# so the match can never succeed and Hyprland starts but paints nothing.
#
# wlroots does NOT share this limitation -- it uses the GBM platform and
# explicitly falls back to the primary node when there is no render node:
#     [wlr] DRM device '/dev/dri/card0' has no render node, falling back to primary node
#     [wlr] Created GL FBO for buffer 1024x768   /   'Virtual-1' connected
# sway 1.12 was verified rendering for real on vkms in exactly this container.
#
# So the image ships BOTH. The entrypoint probes for a usable EGL DRM device and
# picks Hyprland (real Omarchy) when one exists, sway otherwise. All of Omarchy's
# apps, fonts and theming are present either way; only the compositor differs.
#
# NOTE: /usr/bin/sway ships with file capability cap_sys_nice=ep, which is
# outside Docker's default bounding set -- exec fails with a bare "Operation not
# permitted". build-image.sh's capability-scrubbing step (setcap -r) handles it.
OMARCHY_PKGS_FALLBACK=(
  sway              # 1:1.12-4. wlroots 0.19 compositor. Renders on vkms/llvmpipe
                    #   where Hyprland cannot. Needs WLR_RENDERER_ALLOW_SOFTWARE=1.
  swaybg            # background setter; without it sway logs a failed-exec error
                    #   on every start and the desktop is bare black.
)

OMARCHY_PKGS_VNC_URL=(
  "https://archive.archlinux.org/repos/${OMARCHY_ALA_SNAPSHOT}/extra/os/x86_64/aml-1.0.0-1-x86_64.pkg.tar.zst"
)

# noVNC / websockify: NOT PACKAGED IN EITHER REPO.
# `novnc` and `python-websockify` are absent from the 2026/08/25 extra snapshot
# and absent from [offline]. The frozen interface still promises a browser
# client on port 6080 (OMARCHY_ENABLE_NOVNC=1), so build-image.sh must VENDOR
# them — fetch the noVNC and websockify release tarballs from GitHub and unpack
# into /usr/share/novnc and /usr/share/websockify. ~5 MiB combined. The
# interpreter is guaranteed present: python-gobject, nautilus-python and
# python-poetry-core all hard-depend on `python`.
OMARCHY_NOVNC_VENDOR=1


# =============================================================================
# OMARCHY_ASSUME_INSTALLED
# =============================================================================
# The `omarchy` and `omarchy-settings` metapackages hard-%DEPENDS% on bootloader
# and display-manager packages. These are cheap in bytes (18 pkgs / ~190 MiB)
# but sddm alone drags in the FULL xorg-server + xf86-input-libinput +
# xorg-xauth, which a headless Wayland container must not carry.
#
# Total avoided: 18 packages, ~190 MiB —
#   btrfs-progs efibootmgr efivar libnotify libxmu libxt limine
#   limine-mkinitcpio-hook limine-snapper-sync mkinitcpio mkinitcpio-busybox
#   noto-fonts plymouth sddm snapper xf86-input-libinput xorg-server xorg-xauth
# (noto-fonts reappears because we ask for it explicitly. Good.)
#
# ### THE TRAP ###
# --assume-installed alone is NOT ENOUGH for plymouth and sddm. Both are ALSO
# explicit lines in omarchy-base.packages (lines 103 and 116). If you only
# assume-install them they get installed anyway as top-level targets and you
# save nothing. They must be absent from OMARCHY_PKGS_DESKTOP *and* listed here.
# They are. Do not add them back.
#
OMARCHY_ASSUME_INSTALLED=(
  limine                  # bootloader — no boot in a container.
  limine-mkinitcpio-hook  # initramfs generation — no initramfs.
  limine-snapper-sync     # bootloader<->snapshot glue.
  snapper                 # btrfs snapshots — the layer is overlayfs, not btrfs.
  plymouth                # boot splash — needs initramfs + a DRM device.
  sddm                    # display manager — no VT/seat, and pulls xorg-server.
)

# Convenience expander for build-image.sh:
#   mapfile -t flags < <(omarchy_assume_flags)
#   pacman ... "${flags[@]}" ...
omarchy_assume_flags() {
  local p
  for p in "${OMARCHY_ASSUME_INSTALLED[@]}"; do
    printf '%s\n%s\n' '--assume-installed' "$p"
  done
}

# KNOWN DEBT, document it in the README rather than "fixing" it:
# --assume-installed leaves 6 permanently unsatisfiable deps in the local db.
# `pacman -Dk` prints, forever:
#   error: missing 'limine' dependency for 'omarchy'
#   error: missing 'limine-mkinitcpio-hook' dependency for 'omarchy'
#   error: missing 'limine-snapper-sync' dependency for 'omarchy'
#   error: missing 'snapper' dependency for 'omarchy'
#   error: missing 'sddm' dependency for 'omarchy'
#   error: missing 'plymouth' dependency for 'omarchy-settings'
# `pacman -Syu` and `yay` both still work. The alternative is +190 MiB and a
# full xorg-server. Not worth it.


# =============================================================================
# OMARCHY_PKGS_EXCLUDE — every rejection, with its reason
# =============================================================================
# §0 CATEGORY REJECTION, stated once so it is not re-litigated:
#   ALL 76 entries of omarchy-other.packages are excluded. That file is the
#   hardware/kernel/driver set — kernels, kernel headers, GPU drivers, DKMS
#   modules, laptop vendor tools, firmware. A container shares the host kernel
#   and has no hardware. None of it is listed individually below.
#   Likewise: linux, linux-t2, linux-firmware, linux-headers are never
#   installed. PROBE 2 verified the closure contains no kernel, no firmware, no
#   /usr/lib/modules and no /usr/lib/firmware.
#
# §1 The 27 dropped from omarchy-base.packages, plus the bootstrap drops.
#   Format is "name  # reason". One line, one reason, no exceptions.
#
OMARCHY_PKGS_EXCLUDE=(
  # -- no kernel / no physical hardware ---------------------------------------
  asdcontrol                # Apple Studio Display brightness over USB-HID; no USB passthrough.
  bolt                      # Thunderbolt device authorization via /sys/bus/thunderbolt; absent.
  brightnessctl             # writes /sys/class/backlight; no backlight device exists.
  ddcutil                   # DDC/CI over /dev/i2c-*; no i2c character devices.
  kernel-modules-hook       # pacman hook that preserves modules for a running kernel; there is none.
  wireless-regdb            # regulatory database consumed by the kernel's cfg80211; no radio.
  power-profiles-daemon     # needs /sys/firmware/acpi and cpufreq policy files; both absent.

  # -- bluetooth --------------------------------------------------------------
  bluez                     # kernel Bluetooth subsystem + an HCI controller; neither exists.
  bluez-tools               # CLI for the above; useless without bluetoothd.
  bluez-utils               # bluetoothctl; useless without bluetoothd.

  # -- printing ---------------------------------------------------------------
  cups                      # print spooler daemon; no printers, and it drags ghostscript/poppler filters.
  cups-browsed              # discovers remote CUPS queues; pointless with no local spooler.
  cups-filters              # ghostscript/poppler print filter chain; ~200 MiB of pure dead weight.
  cups-pdf                  # PDF-to-file virtual printer backend for CUPS.
  system-config-printer     # GTK printer admin UI for a spooler we do not ship.

  # -- mDNS (present only to serve cups-browsed) ------------------------------
  avahi                     # mDNS/DNS-SD daemon whose only Omarchy consumer is cups-browsed. SEE NOTE 1.
  nss-mdns                  # glibc NSS plugin for .local resolution via avahi-daemon.

  # -- block devices / filesystems --------------------------------------------
  dosfstools                # mkfs/fsck for FAT on block devices; the container has none.
  exfatprogs                # mkfs/fsck for exFAT on block devices; the container has none.
  gnome-disk-utility        # udisks2 partition editor; no block devices to edit.
  udiskie                   # udisks2 automounter tray applet; nothing to automount.

  # -- boot / bootloader / initramfs ------------------------------------------
  limine                    # bootloader; containers do not boot. Also in OMARCHY_ASSUME_INSTALLED.
  limine-mkinitcpio-hook    # initramfs regeneration hook; no initramfs. Also assume-installed.
  limine-snapper-sync       # bootloader/snapshot integration. Also assume-installed.
  snapper                   # btrfs snapshot manager; the rootfs is overlayfs. Also assume-installed.
  efibootmgr                # writes EFI boot variables; /sys/firmware/efi does not exist.
  plymouth                  # boot splash; needs an initramfs and a DRM device. MUST also be assume-installed.

  # -- display manager --------------------------------------------------------
  sddm                      # no VT/seat to log into, and it pulls the FULL xorg-server. MUST also be assume-installed. SEE NOTE 2.

  # -- host-kernel-global state the container cannot own ----------------------
  ufw                       # netfilter administration; unavailable in the container's netns and would sever Docker networking.
  ufw-docker                # helper that rewrites ufw rules for docker; same reason, and there is no ufw.
  qemu-user-static-binfmt   # registers handlers in binfmt_misc, a HOST-GLOBAL kernel registry; +135 MiB and Docker Desktop already provides emulation.

  # -- pointless in a container -----------------------------------------------
  tzupdate                  # sets the timezone by geo-IP at boot; the image should honour TZ, not guess.
)

# ---- NOTES on the exclusions -------------------------------------------------
# NOTE 1 — avahi comes back anyway. It is a hard *library* dependency of libcups
#   (which every GTK app links) and of tinysparql (which nautilus needs). It is
#   the only one of these 27 that reappears transitively. That is harmless: it
#   arrives as a shared library, avahi-daemon.service is never enabled, and no
#   mDNS traffic is generated. Do not chase it.
# NOTE 2 — sddm is genuinely load-bearing in Omarchy's own boot path.
#   omarchy-settings ships /etc/sddm.conf.d/10-wayland.conf and there is
#   /usr/share/omarchy/install/login/sddm.sh. Dropping sddm means NOTHING in
#   /usr/share/omarchy/install will start the session for us — the container
#   entrypoint (/usr/local/bin/omarchy-container-init) must run
#   the compositor directly as user omarchy -- NOT via uwsm, which
#   requires a systemd user manager this image does not have. The orphaned
#   /etc/sddm.conf.d directory is inert; leave it.
# NOTE 3 — xorg-xwayland is DELIBERATELY KEPT. It is a hyprland dependency, not
#   an sddm one, and it is how X11 apps run under Wayland. PROBE 2 verified
#   /usr/bin/Xwayland is present in the built rootfs. Do not confuse it with
#   xorg-server, which we correctly exclude.


# =============================================================================
# OPTIONAL TIERS — both default OFF, both flip on with one variable
# =============================================================================

# --- Docker-in-Docker: policy exclusion, not a technical one -----------------
# 320 MiB. Excluded by default because DinD needs --privileged or a mounted
# host socket, and this image is meant to run unprivileged. Nothing about these
# packages fails in a container; set OMARCHY_ENABLE_DOCKER=1 to include them.
OMARCHY_ENABLE_DOCKER="${OMARCHY_ENABLE_DOCKER:-0}"
OMARCHY_PKGS_DOCKER=(
  docker            # dockerd; requires privileged mode or a host socket bind.
  docker-buildx
  docker-compose
  lazydocker        # TUI; the only one of the four a user would visibly miss.
)

# --- SLIM: drop the seven heaviest applications ------------------------------
# Removal closures measured on the real installed tree by PROBE 2. Together
# these remove 138 packages / ~1.87 GiB and take the rootfs from 6.5 GiB to
# ~4.6 GiB. Set OMARCHY_SLIM=1 to subtract these from OMARCHY_PKGS_DESKTOP.
#
# chromium (416 MiB) and noto-fonts-cjk (298 MiB) are deliberately NOT here —
# the browser and CJK glyph coverage are things a user immediately notices.
OMARCHY_SLIM="${OMARCHY_SLIM:-0}"
OMARCHY_PKGS_SLIM_DROP=(
  kdenlive          # -79 pkgs, -755 MiB. Video editor; unusable under llvmpipe anyway.
  libreoffice-fresh # -36 pkgs, -546 MiB. Office suite.
  obsidian          #  -3 pkgs, -358 MiB. Electron notes app.
  dotnet-runtime    #  -3 pkgs,  -94 MiB. Only needed by a .NET app we do not ship.
  localsend         #  -6 pkgs,  -68 MiB. LAN file transfer; Flutter app.
  obs-studio        #  -9 pkgs,  -43 MiB. Screen recorder; no capture device.
  moonlight-qt      #  -2 pkgs,   -2 MiB. NVIDIA GameStream client; no GPU.
)
# Also measured, NOT in the default slim set — reach for these only if you must:
#   clang + llvm    -3 pkgs, -440 MiB  (breaks C/C++ LSP and tree-sitter builds)
#   chromium        -1 pkg,  -416 MiB  (removes the only browser)
#   noto-fonts-cjk  -1 pkg,  -298 MiB  (CJK text becomes tofu)


# =============================================================================
# FLAGGED — I am not certain about these. Decide before shipping.
# =============================================================================
#  nvim            KEPT verbatim from omarchy-base.packages. Upstream Arch calls
#                  the editor `neovim`; `nvim` resolved cleanly from [offline]
#                  (PROBE 2, rc=0, empty stderr) so it is either an Omarchy
#                  package or a provider. If a future pacman run says "target
#                  not found: nvim", substitute `neovim`.
#  aether cliamp herdr omacalc omacut omawrite tensaku tobi-try ttfx usage
#                  Omarchy 4.0 first-party packages I could not independently
#                  characterise. All resolve from [offline]. Kept because
#                  dropping an unknown user-facing app is worse than shipping
#                  a few MiB. Revisit once someone can describe them.
#  fcitx5 + gtk/qt Input-method framework. Correct for CJK/IME users, but it
#                  adds a keyboard layer between VNC and the app and is a
#                  plausible source of "my keystrokes are weird over VNC" bugs.
#                  Kept (user-visible, in upstream's list); first thing to
#                  suspect if input misbehaves.
#  gpu-screen-recorder  Cannot capture without a DRM node. Kept because its
#                  ffmpeg dependency is required regardless and omarchy's
#                  keybindings invoke it by name.
#  networkmanager  Kept for nmcli, but the service must stay masked/disabled.
#                  If the entrypoint ever enables it, expect broken networking.
#  plocate         Ships a systemd timer that runs updatedb over the whole
#                  rootfs. Harmless but wasteful if the timer is ever enabled.
#  man-db          Mostly moot after /usr/share/man is stripped. ~5 MiB, kept
#                  so `man` exists for AUR-installed pages.


# =============================================================================
# SIZE AND THE 16.4 GB BUDGET
# =============================================================================
# All figures MEASURED by PROBE 2 on the real installed tree, not estimated.
#
#   resolved closure, both phases            867 packages
#   download (from the bind-mounted mirror)  2.03 GiB   -- never copied to disk
#   rootfs as installed                      7486 MiB
#     - /usr/share/{man,doc,info,gtk-doc,help,licenses}   -463 MiB
#     - /usr/share/locale pruned to en*                   -376 MiB
#   rootfs after strip                       6647 MiB  = 6.49 GiB
#   + VNC layer (wayvnc/neatvnc/aml/vulkan-swrast)  ~60 MiB
#   + vendored noVNC + websockify                    ~5 MiB
#   ------------------------------------------------------------
#   FINAL ROOTFS                             ~6.55 GiB
#   tar, raw (streamed, never lands on disk) ~6.28 GiB
#   gzip -1 layer blob written by docker import  ~2.71 GiB
#
# DO NOT strip /usr/include (339 MiB). base-devel and yay are in the set;
# removing headers breaks every AUR build the image exists to support.
#
# PEAK DISK DURING `docker import`:
#     rootfs 6.55 + blob 2.71 + unpacked image snapshot 6.55 = ~15.8 GiB
#   against 16.4 GiB free in the Docker VM. That is ~600 MiB of headroom and it
#   WILL fail on a bad day.
#
#   ==> `docker system prune` IS MANDATORY BEFORE THE BUILD, not advisory.
#       7.4 GB is reclaimable (4.9 images + 2.2 build cache + 0.25 volumes),
#       which takes free space to ~23 GiB and turns 600 MiB of headroom into
#       ~7 GiB. Do this first, every time.
#
#   Two more disk rules, both non-negotiable:
#     * Bind-mount the offline mirror READ-ONLY over the target's
#       $ROOT/var/cache/pacman/pkg. pacman COPIES packages out of a file://
#       repo otherwise, duplicating the whole 2 GiB closure. This is the ISO
#       installer's own trick (_mount_offline_package_cache, phases_impl.py:640).
#       UNMOUNT IT BEFORE TARRING or you tar 4.5 GiB of mirror into the image.
#     * Do NOT relocate the rootfs onto the macOS bind mount to borrow the
#       host's 21 GB. That mount is `type fakeowner` — Docker Desktop
#       synthesizes uid/gid, so every pacman-installed file would come out with
#       wrong ownership. Buy headroom with prune, not with the bind mount.
#
# WITH OMARCHY_SLIM=1:
#   rootfs ~4.68 GiB, blob ~1.95 GiB, peak ~11.3 GiB. Comfortable even without
#   a prune — but prune anyway.
#
# WITH OMARCHY_ENABLE_DOCKER=1: add ~320 MiB to every figure above.


# =============================================================================
# RUNTIME PACMAN CONFIG THE IMAGE MUST SHIP (or it ships broken)
# =============================================================================
# Append to the IMAGE's /etc/pacman.conf, not just the build-side one:
#
#   [options]
#   DisableSandbox                 # WITHOUT THIS, every in-container `pacman
#                                  # -Sy` and every `yay` dies with "restricting
#                                  # filesystem access failed because Landlock
#                                  # is not supported by the kernel" then
#                                  # "switching to sandbox user 'alpm' failed".
#
#   [extra]
#   SigLevel = Never               # the ALA keyring will not match the snapshot
#   Server = https://archive.archlinux.org/repos/2026/08/25/$repo/os/$arch
#
# Also worth a build-time check: Arch's /usr/bin/sway carried a file capability
# (cap_sys_nice=ep) that is outside Docker's default bounding set, making exec
# fail with a bare "Operation not permitted". Run `getcap -r /usr/bin` on the
# finished rootfs and `setcap -r` anything that turns up.
