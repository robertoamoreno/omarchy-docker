# =============================================================================
# /etc/omarchy-container/sway.conf — wlroots fallback compositor
# =============================================================================
#
# THIS IS NOT OMARCHY. It is the compositor the entrypoint falls back to when
# the host cannot run Hyprland at all, which on Docker Desktop for macOS is
# always. Read the block in /etc/omarchy-container/env under OMARCHY_COMPOSITOR
# for the full reason; the short version:
#
#   Hyprland 0.56.2 -> aquamarine 0.14.0 -> CBackend::start() builds its GBM
#   allocator only from a backend whose drmFD() >= 0. The headless backend
#   returns -1 unconditionally, and Hyprland never asks for AQ_BACKEND_NULL,
#   the one backend type that skips the check. No DRM node, no compositor.
#
# sway is wlroots, and wlroots has a pixman renderer that rasterises on the CPU
# with no DRM node and no GBM allocator at all. PROBE 1 verified this exact
# combination end to end on the reference host: sway 1.12 headless + pixman +
# wayvnc 0.10.1 on HEADLESS-1 produced a real 1280x800 framebuffer over RFB,
# 346 distinct colours, a ticking clock and a live focus border.
#
# Loaded via a generated wrapper at /run/user/1000/omarchy-container/sway.conf:
#     include /etc/omarchy-container/sway.conf      <- this file
#     output HEADLESS-1 mode --custom <resolution>
# Later output commands win, so the runtime resolution overrides the mode set
# here. ~/.config/omarchy-container/sway.conf is included afterwards if present.
#
# Requires the `sway` package (and `swaybg` for the background colour). Neither
# is in the ISO's [offline] mirror; both come from the pinned ALA snapshot. If
# sway is absent from the image the entrypoint refuses to start and says so.
# =============================================================================

set $mod Mod4
set $alt Mod1
set $term foot


# --- output ------------------------------------------------------------------
# The headless output itself is created by WLR_HEADLESS_OUTPUTS=1, which the
# entrypoint exports. --custom is required: a headless output advertises no
# modes to pick from.
output HEADLESS-1 mode --custom 1920x1080@60Hz
output HEADLESS-1 position 0 0

# Flat colour rather than a wallpaper: cheap to encode over VNC, and it makes a
# live framebuffer instantly distinguishable from the grey-screen capture
# failure in RESEARCH.md §7. Needs swaybg; without it sway logs one error and
# carries on with a black background, which is harmless.
output HEADLESS-1 bg #1a1b26 solid_color


# --- input -------------------------------------------------------------------
# Must match wayvnc.conf's xkb_layout / xkb_rules or VNC keystrokes arrive as
# the wrong symbols.
input * {
    xkb_layout us
    xkb_rules evdev
}
focus_follows_mouse yes


# --- appearance --------------------------------------------------------------
# No titlebars (pixels are bandwidth), a visible focus border instead.
default_border pixel 2
default_floating_border pixel 2
gaps inner 4
gaps outer 8
client.focused          #7aa2f7 #7aa2f7 #1a1b26 #7aa2f7 #7aa2f7
client.unfocused        #414868 #414868 #c0caf5 #414868 #414868
client.focused_inactive #414868 #414868 #c0caf5 #414868 #414868

# X11 apps go through Xwayland, which is in the image as a hyprland dependency.
# It works under a pixman-rendered compositor, just without acceleration.
xwayland enable


# --- status bar --------------------------------------------------------------
# A clock is not decoration here: it is the cheapest possible liveness proof.
# If the bar's seconds are ticking in your VNC client, capture is working and
# damage tracking is reaching the encoder. If they freeze, it is not.
bar {
    position top
    font pango:monospace 10
    # Sway's config parser strips the quotes before the line reaches the shell,
    # so `date '+%Y-%m-%d %H:%M:%S'` arrives as TWO arguments and dies with
    #     date: extra operand '%H:%M:%S'
    # Calling a script sidesteps the quoting rules entirely.
    status_command /etc/omarchy-container/statusbar.sh
    colors {
        statusline #c0caf5
        background #1a1b26
        focused_workspace #7aa2f7 #7aa2f7 #1a1b26
        inactive_workspace #1a1b26 #1a1b26 #c0caf5
    }
}


# --- keybinds ----------------------------------------------------------------
# EVERY binding is available on BOTH Super ($mod) and Alt ($alt), deliberately.
#
# In a browser (noVNC) on macOS the OS and the browser consume Cmd-based
# combos before noVNC ever sees them, and Cmd is what most clients map to
# Super. Option/Alt is NOT a browser accelerator on macOS, so $alt combos do
# reach the desktop. noVNC 1.5 does not implement navigator.keyboard.lock(),
# so there is no way to capture the stolen keys -- full Alt aliases are the
# fix, not a nicety. (A native VNC client avoids the problem entirely and is
# still the better experience; see README > Keyboard.)
bindsym $mod+Return exec $term
bindsym $alt+Return exec $term
bindsym $mod+q kill
bindsym $alt+q kill
bindsym $mod+b exec chromium --ozone-platform=wayland --no-sandbox --disable-gpu
bindsym $alt+b exec chromium --ozone-platform=wayland --no-sandbox --disable-gpu
bindsym $mod+e exec nautilus --new-window
bindsym $alt+e exec nautilus --new-window
bindsym $mod+f fullscreen toggle
bindsym $alt+f fullscreen toggle
bindsym $mod+Shift+space floating toggle
bindsym $alt+Shift+space floating toggle
bindsym $mod+Shift+m exit
bindsym $alt+Shift+m exit

bindsym $mod+Left focus left
bindsym $mod+Right focus right
bindsym $mod+Up focus up
bindsym $mod+Down focus down
bindsym $alt+Left focus left
bindsym $alt+Right focus right
bindsym $alt+Up focus up
bindsym $alt+Down focus down
# hjkl too: arrow keys are themselves remapped by some clients
bindsym $alt+h focus left
bindsym $alt+l focus right
bindsym $alt+k focus up
bindsym $alt+j focus down

bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $alt+1 workspace number 1
bindsym $alt+2 workspace number 2
bindsym $alt+3 workspace number 3
bindsym $alt+4 workspace number 4
bindsym $alt+5 workspace number 5
bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $alt+Shift+1 move container to workspace number 1
bindsym $alt+Shift+2 move container to workspace number 2
bindsym $alt+Shift+3 move container to workspace number 3

# Split direction + layout, on Alt as well.
bindsym $mod+v splitv
bindsym $alt+v splitv
bindsym $mod+Shift+v splith
bindsym $alt+Shift+v splith
bindsym $mod+s layout stacking
bindsym $alt+s layout stacking
bindsym $mod+w layout tabbed
bindsym $alt+w layout tabbed
bindsym $mod+t layout toggle split
bindsym $alt+t layout toggle split

floating_modifier $alt normal


# --- autostart ---------------------------------------------------------------
# Same hook as the Hyprland path, so a fresh VNC connection shows something.
exec /etc/omarchy-container/autostart.sh
