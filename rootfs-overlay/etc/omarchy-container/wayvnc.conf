# =============================================================================
# /etc/omarchy-container/wayvnc.conf — wayvnc 0.10.1 configuration
# =============================================================================
#
# TEMPLATE, not the file wayvnc actually reads. omarchy-container-init copies
# this to /run/user/1000/omarchy-container/wayvnc.conf, strips the five keys it
# owns at runtime (address, port, enable_auth, username, password) and appends
# live values for them, so there is exactly one definition of each and no
# question about which wins. Everything else here is passed through untouched.
#
# Syntax is key=value, one per line, `#` comments, no sections. Values are NOT
# shell-quoted — do not wrap them in quotes.
#
# The output to capture is NOT set here: it is a command-line flag (-o), and the
# entrypoint passes the output it actually found (HEADLESS-1 normally, or
# whatever the compositor reported if it differs).
#
# PROBE 1 note: this exact wayvnc 0.10.1 has already been proven on the
# reference host against a headless wlroots output — real framebuffer, 346
# distinct colours over RFB. The VNC layer is not the risky part of this stack.
# =============================================================================


# --- listener ----------------------------------------------------------------
# Both are overwritten at runtime from OMARCHY_VNC_ADDRESS / OMARCHY_VNC_PORT.
# They are kept here so this file is complete and usable standalone:
#     wayvnc -C /etc/omarchy-container/wayvnc.conf -o HEADLESS-1
address=0.0.0.0
port=5900


# --- authentication ----------------------------------------------------------
# Overwritten at runtime: enable_auth becomes true, with username/password, iff
# OMARCHY_VNC_PASSWORD is non-empty.
#
# Default is NO AUTHENTICATION, matching the frozen interface. Understand what
# that means before publishing the port: the desktop has a passwordless-sudo
# shell one keybind away, so an exposed 5900 is an exposed root shell. Bind to
# 127.0.0.1 and tunnel, or put a proxy in front.
#
# wayvnc's authenticated security types need key material (VeNCrypt wants a TLS
# certificate + private key; RSA-AES wants an RSA key). If you turn auth on and
# wayvnc refuses to start, that is why — the entrypoint will print wayvnc's own
# log and exit non-zero rather than silently falling back to no auth. Supply the
# key material by uncommenting the relevant pair below and bind-mounting the
# files in.
enable_auth=false
#username=omarchy
#password=changeme
#private_key_file=/etc/omarchy-container/tls/key.pem
#certificate_file=/etc/omarchy-container/tls/cert.pem
#rsa_private_key_file=/etc/omarchy-container/tls/rsa_key.pem


# --- keyboard ----------------------------------------------------------------
# This is the single highest-value setting in the file for usability. VNC
# transports keysyms, and wayvnc has to turn them back into keycodes against a
# keymap; if that keymap does not match the compositor's, keystrokes arrive as
# the wrong symbols — most visibly punctuation, brackets and modifiers.
#
# evdev rules + a us layout matches what both hyprland.conf (input:kb_rules,
# input:kb_layout) and sway.conf (input * xkb_rules/xkb_layout) declare. Change
# all of them together or none of them.
xkb_rules=evdev
xkb_layout=us
xkb_model=pc105
#xkb_variant=
#xkb_options=ctrl:nocaps


# --- performance -------------------------------------------------------------
# NOTE: `max_fps` is NOT a config-file key -- it is the command-line flag
# -f/--max-fps, and wayvnc rejects the whole config with
#     ERROR: Failed to load config. Error on line N
# if you put it here. (Verified against wayvnc 0.10.1: the accepted keys are
# address, port, enable_auth, username, password, certificate_file,
# rsa_private_key_file, use_relative_paths, relax_encryption and the xkb_* set.)
# The entrypoint passes -f "$OMARCHY_MAX_FPS" instead; the default is 30, which
# is also wayvnc's own default. Software rendering plus software encoding means
# the frame-rate ceiling is the CPU, so capping it keeps an animated window from
# starving the compositor of the CPU it needs to draw the next frame.

# Deliberately FALSE. wayvnc resolves relative paths against the directory of
# the config file it actually read — and that is the generated copy in
# /run/user/1000/omarchy-container, not this directory. A relative
# `certificate_file=tls/cert.pem` written here would silently look for
# /run/user/1000/omarchy-container/tls/cert.pem. Use absolute paths for key
# material, as the commented examples above do.
use_relative_paths=false
