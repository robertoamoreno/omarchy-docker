# =============================================================================
# /etc/omarchy-container/hyprland.conf — headless Hyprland for omarchy:4.0.1
# =============================================================================
#
# NOT loaded directly. omarchy-container-init generates
# /run/user/1000/omarchy-container/hyprland.conf, which does:
#
#     source = /etc/omarchy-container/hyprland.conf     <- this file
#     monitor = HEADLESS-1, <OMARCHY_RESOLUTION>, 0x0, 1
#
# so the runtime resolution overrides the default below (last monitor rule for a
# given name wins). Edit this file for anything persistent; edits to the
# generated one are lost on restart. A per-user extra is also sourced if it
# exists: ~/.config/omarchy-container/hyprland.conf.
#
# THIS IS A DELIBERATELY MINIMAL CONFIG, not Omarchy's own. Omarchy's desktop
# config lives in /usr/share/omarchy/default/hypr/ and expects waybar, quickshell,
# hypridle, hyprlock, walker and a systemd user session — most of which either
# have nothing to do in a container or need the systemd we do not have. To try it
# anyway, uncomment the source line at the bottom and expect noise.
#
# EVERY CHOICE HERE ASSUMES: no GPU (llvmpipe on the CPU), no physical input
# devices (events arrive over RFB), no monitor hotplug, one output.
# =============================================================================


# --- output ------------------------------------------------------------------
# Explicit, never `monitor=,preferred,auto,auto`: there is no preferred mode to
# read from an EDID that does not exist. The entrypoint re-issues this same rule
# over IPC after startup (hyprctl keyword monitor), which also covers the case
# where the output had to be created with `hyprctl output create headless`.
monitor = HEADLESS-1, 1920x1080@60, 0x0, 1

# DO NOT bind workspaces to the monitor here.
#     workspace = 1, monitor:HEADLESS-1     # <-- do not do this
# Prior art (thariman/wayvnc-omarchy) and RESEARCH.md §7 both record that STATIC
# workspace assignment prevents Hyprland from starting in this setup: the rule is
# evaluated before the headless output exists, so it binds to nothing. Let
# workspaces be created dynamically on first use, which is the default.


# --- rendering: everything expensive is off ----------------------------------
# llvmpipe rasterises on the CPU, and on this project's reference host it does so
# under Rosetta. Blur, shadows and animations are the difference between a
# usable desktop and a slideshow, and they also cost VNC bandwidth: every
# animated pixel is a damage region wayvnc has to encode and ship.
animations {
    enabled = false
}

decoration {
    rounding = 0
    active_opacity = 1.0
    inactive_opacity = 1.0
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

general {
    border_size = 2
    gaps_in = 4
    gaps_out = 8
    col.active_border = rgba(7aa2f7ff)
    col.inactive_border = rgba(414868ff)
    layout = dwindle
    # Tearing needs a real scanout path. There is none.
    allow_tearing = false
    resize_on_border = true
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    # A flat colour costs nothing to encode and, importantly, makes a live VNC
    # framebuffer instantly distinguishable from the grey-screen capture failure
    # described in RESEARCH.md §7.
    background_color = 0x1a1b26
    # Variable refresh: only redraw on damage. On a headless output with a VNC
    # client attached this is exactly what we want — an idle desktop should cost
    # no CPU at all.
    vfr = true
    vrr = 0
    # There is no display to blank and no power management to speak of; a DPMS
    # off would just hand wayvnc a black framebuffer.
    mouse_move_enables_dpms = false
    key_press_enables_dpms = false
    disable_autoreload = true
    focus_on_activate = true
}

cursor {
    # Hardware cursor planes require a DRM plane. Composite the cursor into the
    # framebuffer instead — this is also what makes the pointer visible to a VNC
    # client that is not drawing its own.
    no_hardware_cursors = true
    use_cpu_buffer = true
    # Never hide the cursor on a timer: a hidden cursor over VNC reads as a
    # frozen desktop.
    inactive_timeout = 0
    no_warps = true
}

render {
    # Explicit sync needs driver support that llvmpipe does not usefully provide.
    explicit_sync = 0
    direct_scanout = false
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

xwayland {
    # X11 clients (via /usr/bin/Xwayland, kept in the image on purpose) have no
    # business doing fractional scaling here.
    force_zero_scaling = true
}


# --- input -------------------------------------------------------------------
# The keymap must match wayvnc.conf's xkb_layout, or VNC keystrokes arrive as
# the wrong symbols. Both are us/evdev.
input {
    kb_layout = us
    kb_rules = evdev
    follow_mouse = 1
    numlock_by_default = true
    sensitivity = 0
    touchpad {
        natural_scroll = false
    }
}


# --- logging -----------------------------------------------------------------
# Not optional for a container. Hyprland writes almost nothing to stdout by
# default, and on an early abort its log file stays empty — which makes an
# aquamarine backend failure look like a config error. With this on, the
# entrypoint captures the real diagnostics and can print them when it dies.
debug {
    disable_logs = false
    enable_stdout_logs = true
}


# --- keybinds ----------------------------------------------------------------
# NOTE: many VNC clients swallow or remap Super. Every binding below is also
# reachable with ALT as a second modifier for exactly that reason.
$mod = SUPER
$alt = ALT
$terminal = foot
$browser = chromium --ozone-platform=wayland --no-sandbox --disable-gpu
$filemanager = nautilus --new-window

bind = $mod, Return, exec, $terminal
bind = $alt, Return, exec, $terminal
bind = $mod, Q, killactive,
bind = $alt, Q, killactive,
bind = $mod, E, exec, $filemanager
bind = $mod, B, exec, $browser
bind = $mod, V, togglefloating,
bind = $mod, F, fullscreen, 0
bind = $mod, P, pseudo,
bind = $mod, J, togglesplit,
bind = $mod SHIFT, M, exit,

# Focus
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

# Workspaces — dynamic, created on demand. See the warning at the top of the
# file: these switch to a workspace, they do not statically bind one to an output.
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $alt, 1, workspace, 1
bind = $alt, 2, workspace, 2
bind = $alt, 3, workspace, 3
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3

# Mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow


# --- autostart ---------------------------------------------------------------
# Without this a fresh VNC connection shows an empty flat-colour desktop and no
# way to tell a working compositor from a broken capture. The script opens a
# terminal with connection details, and is the hook point for anything else you
# want running in the session.
exec-once = /etc/omarchy-container/autostart.sh

# Omarchy's real desktop config. Needs waybar/quickshell/hypridle/hyprlock and a
# systemd user session; expect config errors and missing binaries. Uncomment
# only if you are deliberately experimenting.
# source = /usr/share/omarchy/default/hypr/hyprland.conf
